<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regnum: Reliquias del Pasado - Maqueta Visual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&display=swap');
    
    body {
      font-family: 'MedievalSharp', cursive;
      background-color: #0d0a08;
      color: #e2d1a6;
    }
    
    .pixel-text {
      font-family: 'Press Start 2P', monospace;
    }

    /* Tablero Damero del Trono de Zuldrak */
    .chessboard {
      background-color: #1a1614;
      background-image: 
        linear-gradient(45deg, #2b231f 25%, transparent 25%),
        linear-gradient(-45deg, #2b231f 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2b231f 75%),
        linear-gradient(-45deg, transparent 75%, #2b231f 75%);
      background-size: 40px 40px;
      background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
    }

    .border-ornate {
      border: 4px solid #8c6d3b;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="flex flex-col items-center min-h-screen p-2 sm:p-4">

  <!-- MARCO PRINCIPAL DEL JUEGO -->
  <div class="w-full max-w-md bg-[#1c1612] border-ornate rounded-lg p-4 flex flex-col gap-4 shadow-2xl">
    
    <!-- HEADER: PANEL DEL HÉROE Y BIOMA -->
    <div class="bg-[#2a211b] border-2 border-[#5c4728] rounded p-3 flex justify-between items-center shadow-inner">
      <div>
        <h1 class="text-lg font-bold text-[#f59e0b] tracking-wide">El Mago</h1>
        <div class="flex gap-1 my-1">
          <span class="text-red-500 text-sm">♥</span>
          <span class="text-red-500 text-sm">♥</span>
          <span class="text-red-500 text-sm">♥</span>
          <span class="text-red-500 text-sm">♥</span>
          <span class="text-red-500 text-sm">♥</span>
          <span class="text-gray-600 text-sm">♥</span>
        </div>
        <p class="text-xs text-[#a3907c]">Dif: Normal</p>
      </div>

      <div class="text-right">
        <span class="text-xs uppercase bg-[#8c2b2b] text-white px-2 py-0.5 rounded font-bold tracking-wider">Piso 10</span>
        <p class="text-xs text-[#e2d1a6] mt-1 font-bold">Trono de Zuldrak</p>
        <div class="flex justify-end gap-1 mt-1">
          <span title="Fragmento 1" class="text-yellow-400 text-xs">🗡️</span>
          <span title="Fragmento 2" class="text-yellow-400 text-xs">🗡️</span>
          <span title="Fragmento 3" class="text-yellow-400 text-xs">💎</span>
        </div>
      </div>
    </div>

    <!-- TABLERO TÁCTICO DE 5x5 -->
    <div class="relative aspect-square w-full chessboard border-2 border-[#5c4728] rounded grid grid-cols-5 gap-1 p-1">
      
      <!-- Casilla Vacia -->
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>

      <!-- ZULDRAK (JEFE) EN EL TABLERO -->
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-red-900/60 bg-red-950/30 rounded flex items-center justify-center relative">
        <div class="w-10 h-10 rounded-full border-2 border-red-600 bg-red-900 flex items-center justify-center shadow-[0_0_10px_rgba(220,38,38,0.8)]">
          <span class="text-xl">💀</span>
        </div>
        <span class="absolute -bottom-1 bg-red-900 text-white text-[9px] px-1 rounded font-bold">12 HP</span>
      </div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>

      <!-- Casillas intermedias -->
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-purple-900/40 bg-purple-950/20 rounded flex items-center justify-center">
        <!-- Esbirro Invocado -->
        <div class="w-8 h-8 rounded-full border border-purple-500 bg-purple-900/80 flex items-center justify-center">
          <span class="text-xs">🧟</span>
        </div>
      </div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>

      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>

      <!-- HÉRONE (MAGO) EN POSICIÓN -->
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-amber-600/60 bg-amber-900/20 rounded flex items-center justify-center relative">
        <div class="w-10 h-10 rounded-full border-2 border-purple-400 bg-purple-900 flex items-center justify-center shadow-[0_0_10px_rgba(168,85,247,0.8)]">
          <span class="text-xl">🧙‍♂️</span>
        </div>
        <span class="absolute -bottom-1 bg-purple-950 text-purple-200 text-[9px] px-1 rounded font-bold">Tú</span>
      </div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>
      <div class="border border-[#3d2e1e]/40 rounded flex items-center justify-center"></div>

    </div>

    <!-- PANEL INFERIOR: DADOS Y ACCIONES -->
    <div class="bg-[#2a211b] border-2 border-[#5c4728] rounded p-3 flex flex-col gap-3">
      
      <div class="flex justify-between items-center">
        <span class="text-xs text-[#a3907c] uppercase tracking-wider font-bold">Reserva de Dados</span>
        <span class="text-xs text-amber-400">Selecciona para actuar</span>
      </div>

      <!-- TIRA DE DADOS -->
      <div class="flex justify-center gap-3">
        <button class="w-12 h-12 bg-amber-100 text-amber-950 font-bold rounded-lg border-2 border-amber-500 shadow-md flex items-center justify-center text-xl hover:bg-amber-200 transition">
          5
        </button>
        <button class="w-12 h-12 bg-amber-100 text-amber-950 font-bold rounded-lg border-2 border-amber-500 shadow-md flex items-center justify-center text-xl hover:bg-amber-200 transition">
          3
        </button>
        <button class="w-12 h-12 bg-amber-100 text-amber-950 font-bold rounded-lg border-2 border-amber-500 shadow-md flex items-center justify-center text-xl hover:bg-amber-200 transition">
          6
        </button>
      </div>

      <!-- ACCIONES DE COMANDO -->
      <div class="grid grid-cols-3 gap-2 mt-1">
        <button class="bg-[#3b2d20] hover:bg-[#4a3a2b] text-amber-200 border border-[#8c6d3b] text-xs py-2 rounded font-bold transition">
          🚶 Mover
        </button>
        <button class="bg-[#782424] hover:bg-[#8c2b2b] text-white border border-red-500 text-xs py-2 rounded font-bold transition">
          ⚔️ Atacar
        </button>
        <button class="bg-[#254d32] hover:bg-[#2e613f] text-emerald-100 border border-emerald-500 text-xs py-2 rounded font-bold transition">
          🛡️ Defender
        </button>
      </div>

    </div>

  </div>

</body>
</html>
